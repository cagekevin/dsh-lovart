# lovart-dsh-plugin 的 bundle 层。
# `dsh plugin add` 把本包装进 profile 后，profile 的 dsh.profile.bundles 选中它，
# 下面的 insert 才会被合进 cordis 组合；id 与包名对齐，name 按包名解析到已安装副本。
#
# 包名不用 `dsh-` 开头：桌面端启动时会把以 dsh- 命名的插件当作「内部预设插件」，
# 不在它自己的清单里就判为孤立并强制卸载（日志 Uninstalling orphaned internal
# preset plugins）。改名是为了避开那条规则，不是命名偏好。
- insert:
    - id: lovart
      name: "lovart-dsh-plugin"
